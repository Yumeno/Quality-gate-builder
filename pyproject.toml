[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-gate-builder"
version = "0.1.0"
description = "Generates trace-based quality gates for arbitrary target projects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yumeno" },
]
keywords = ["quality-gate", "tdd", "ai-assisted-development", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pip-tools>=7.4,<8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/Yumeno/Quality-gate-builder"
Issues = "https://github.com/Yumeno/Quality-gate-builder/issues"

[tool.setuptools.packages.find]
include = ["qgb*"]

[tool.setuptools.package-data]
qgb = ["schemas/*.json", "schemas/*.md", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
