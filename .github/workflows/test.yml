# qgb test CI (Phase 3 Step 3.1e + Step 3.2, 2026-06-24).
#
# Design rationale:
#
# - **Why a CI at all?** Step 3.1 applies qgb's own philosophy P6
#   ("LLM 単独 ALLOW 禁止") to qgb itself: "Windows ローカルで pytest が
#   通った" だけでは POSIX 経路の証跡にならない。CI 緑 = 機械的判定
#   (P7 再現可能証跡). See development/docs/journal/phase3-step3-1-prejournal.md
#   "1. なぜ CI 雛形を本 Step に含めるのか".
#
# - **Matrix minimality (Codex 指摘で 3.10 + 3.12 二端のみ).** Python
#   3.11 を省く判断は P11 (ALLOW の比較不可能性 = OS × version 組合せ
#   ごとに別判定) と整合。Phase 5 提供前に 3.11 追加を再判断する予定。
#
# - **third-party action ゼロ (NF-011).** actions/checkout + actions/setup-python
#   のみ GitHub 公式。Dependabot/Renovate なし、SHA pin 手動更新、
#   pin 更新規約は SECURITY.md で明文化済。
#
# - **secrets 不使用 / permissions: contents: read.** この CI は読み取り
#   専用なので token leak リスクを最小化。persist-credentials: false
#   で checkout が token を残さないようにする (Codex 指摘)。
#
# - **timeout-minutes: 20.** Step 3.1c の 16 MiB cap + process tree kill
#   が機能してもなお stuck した場合の最終ガード (Codex 指摘)。
#
# - **pull_request_target 不使用.** PR 由来コードに read 以上を与えない
#   (Codex 指摘); on.pull_request のみ。
#
# - **Step 3.2 (2026-06-24): lock + hash 経路導入.** runtime / dev の
#   layered lock を --require-hashes --only-binary :all: で install し、
#   sdist 任意コード実行面を閉じる (pip secure installs 推奨)。lock と
#   pyproject.toml の整合性は temp lock + git diff --exit-code で機械検証
#   (ubuntu-latest + Python 3.12 の 1 job のみ)。artifact 化は採用しない
#   (qgb 本体 CI 責務外、利用者運用、JUnit XML WONTFIX と同型)。詳細は
#   development/docs/journal/phase3-step3-2-prejournal.md。
#
# - **Step 5.b-ci (2026-07-04): golden-integrity job 追加.** pytest matrix
#   は build vs committed golden の byte 一致を既に 4 セルで検証済みだが、
#   それは build_all() を直接呼ぶ経路のみ。tools/regen_golden.py という
#   別経路 (メンテナが実際に golden 更新時に叩くスクリプト) がドリフト
#   なく committed golden を再現するかは別の検証対象、という理由で独立
#   job 化。ubuntu-latest 単独 (golden bytes は .gitattributes の LF 強制
#   + stdlib-only emission により OS 非依存と設計上保証済み)。詳細は
#   development/docs/journal/phase5-step5-c-prejournal.md。

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      # actions/checkout v7.0.0 (2026-06-18) — SHA pin per SECURITY.md
      # "Action SHA Pin Policy". Update via the procedure documented
      # there; do not bump silently.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # actions/setup-python v6.2.0 (2026-01-22) — SHA pin per SECURITY.md.
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3.2: install from lock with hash verification + binary-only.
      # --require-hashes: every package's bytes are pinned (NF-011).
      # --only-binary :all:: sdist 任意コード実行面を閉じる (pip secure installs).
      # dev lock is layered on top of runtime lock via -c (constraint),
      # so dev install cannot override runtime pins.
      - name: Install dev dependencies (hash-verified, binary-only)
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"

      # qgb itself: editable install without re-resolving deps and
      # without PEP 517 build isolation. The dev lock above already
      # installed setuptools / wheel at hash-pinned versions; with
      # build isolation, pip would otherwise spin up an isolated venv
      # and re-fetch setuptools / wheel from PyPI bypassing
      # --require-hashes (NF-011 / Step 3.2 review finding M1).
      - name: Install qgb (editable, no deps, no build isolation)
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Show resolved environment
        run: |
          python --version
          pip --version
          pip list

      - name: Run pytest
        run: pytest -ra

  lock-integrity:
    name: lock vs pyproject.toml integrity
    # Lock files are generated on Windows + Python 3.10 by the maintainer
    # and the integrity check must regenerate under the *same* environment
    # to avoid spurious diffs. pip-compile's resolution is per-(OS, Python):
    # - Python markers (python_version<"3.13") gate typing-extensions,
    #   exceptiongroup, tomli;
    # - OS markers (platform_system=="Windows", sys_platform=="win32") gate
    #   colorama (pulled in by click + pytest on Windows only).
    # A lock generated on Windows/3.10 contains the superset needed across
    # the full (windows/ubuntu × 3.10/3.12) matrix, since unused entries
    # are silently skipped by the install-time environment markers on
    # other platforms. The reverse (Ubuntu lock) lacks the Windows-only
    # transitives and breaks Windows installs.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"

      # The dev lock contains pip-tools itself + its deps (pip / setuptools
      # / build / etc) under --allow-unsafe, so installing it here gives
      # us a hash-verified pip-compile invocation that mirrors what a
      # human maintainer runs locally.
      - name: Install dev lock (for pip-tools)
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"

      # Regenerate locks into tmp/ and compare against committed locks.
      #
      # The committed lock is COPIED into tmp/ first; pip-compile reads
      # the existing output file as its starting point and refuses to
      # bump pins unless --upgrade is passed. This means the check
      # answers the right question — "is the committed lock consistent
      # with pyproject.toml's current dependency ranges?" — rather than
      # "did PyPI publish a new version since the lock was committed?".
      # Upstream releases are caught by the periodic regenerate-and-bump
      # process described in SECURITY.md "Dependency Lock Policy", not
      # by this gate.
      #
      # tools/diff_locks.py strips pip-compile's autogenerated header
      # block (the "# by the following command" lines) before comparing,
      # because that block embeds the --output-file path which differs
      # between the human-side invocation (requirements.lock) and the
      # CI invocation (tmp/requirements.lock).
      # NOTE: shell: bash is required because Windows runners default to
      # PowerShell, which does not parse "\"-continued multi-line commands
      # the same way bash does. Git Bash ships on windows-latest runners
      # by default, so this works without any tooling change.
      - name: Regenerate locks into tmp/ using committed lock as seed
        shell: bash
        run: |
          mkdir -p tmp
          cp requirements.lock tmp/requirements.lock
          cp requirements-dev.lock tmp/requirements-dev.lock
          python -m piptools compile --generate-hashes \
            --output-file=tmp/requirements.lock pyproject.toml
          python -m piptools compile --generate-hashes --allow-unsafe \
            --extra=dev --constraint=requirements.lock \
            --output-file=tmp/requirements-dev.lock pyproject.toml

      - name: Compare lock bodies (ignoring autogenerated headers)
        shell: bash
        run: |
          python tools/diff_locks.py requirements.lock tmp/requirements.lock
          python tools/diff_locks.py requirements-dev.lock tmp/requirements-dev.lock

  golden-integrity:
    name: golden fixtures vs regen script
    # Phase 5 Step 5.b-ci. runs-on: ubuntu-latest (cheapest runner) because
    # golden bytes are platform-independent BY DESIGN, not by luck:
    # - LF is forced repo-wide for every build-input extension (.py/.md/.json/
    #   .yaml/.yml) via .gitattributes, so git checkout cannot reintroduce
    #   CRLF drift on any OS.
    # - build_skill.py's own emission (_dump_frontmatter, generator header,
    #   render_full/render_split) is stdlib-only; no platform-dependent
    #   library output (e.g. PyYAML dump) ever reaches written bytes.
    # - The `test` job's own matrix already proves build-vs-golden equality
    #   is byte-identical across both OSes and both Python versions
    #   (test_build_skill_golden.py runs in all 4 cells).
    # This job is therefore NOT re-checking OS-portability; it exists to
    # validate a DIFFERENT path than the pytest matrix: that
    # `tools/regen_golden.py` -- the script a maintainer actually runs to
    # update goldens after an intentional change -- reproduces exactly what
    # is committed under tools/_golden/. A golden that was hand-edited, or
    # regenerated with an uncommitted follow-up edit forgotten, fails here
    # even though test_build_skill_golden.py (which calls build_all()
    # directly, not the regen script) would not have caught it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"

      - name: Install dev dependencies (hash-verified, binary-only)
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock"

      # No editable qgb install here (unlike the `test` job): build_skill.py
      # and regen_golden.py import only the stdlib plus dev-lock-installed
      # yaml / jsonschema -- neither imports anything from the qgb package
      # itself. Installing qgb editable would add an unused step.
      - name: Regenerate goldens
        # SOURCE_DATE_EPOCH is intentionally not set anywhere in this job's
        # env: regen_golden.py refuses (exit 2) if it is set, since
        # tools/_golden/ is the SOURCE_DATE_EPOCH-unset lineage only
        # (prejournal Sec.3.3). GitHub-hosted runners do not set this
        # variable themselves, so no explicit unset step is needed --
        # this comment documents the invariant the job relies on.
        run: python tools/regen_golden.py

      # Two checks, not one: `git diff --exit-code` alone misses files that
      # regen_golden.py added or deleted (a diff against a path that didn't
      # exist before, or that no longer exists, doesn't show up the same
      # way as a content change). `git status --porcelain` surfaces added
      # ("??" / "A") and deleted ("D") entries directly; `git diff
      # --exit-code` then confirms no tracked file's bytes changed either.
      - name: Fail if regen produced any working-tree drift
        shell: bash
        run: |
          test -z "$(git status --porcelain tools/_golden/)"
          git diff --exit-code tools/_golden/
